[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phonon-key-lab"
version = "0.1.0"
description = "Benign fatigue and resonance-drift laboratory simulator"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.scripts]
phonon-key-lab = "phonon_key.cli:main"

[tool.setuptools.packages.find]
where = ["."]
